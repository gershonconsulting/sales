name: Deploy sales.gershon.ai
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets missing (see CHECKPOINTS/CP-sales-001.md)"; exit 1; fi
      - name: Ensure D1 database + schema
        run: |
          getid() { npx -y wrangler@3 d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==='sales-db');console.log(d?d.uuid:'')})"; }
          ID=$(getid)
          if [ -z "$ID" ]; then npx -y wrangler@3 d1 create sales-db; ID=$(getid); fi
          echo "D1 id: $ID"
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          npx -y wrangler@3 d1 execute sales-db --remote --file=schema.sql
      - name: Deploy worker
        run: npx -y wrangler@3 deploy
      - name: Push runtime secrets
        env:
          STREAK_API_KEY: ${{ secrets.STREAK_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          for S in STREAK_API_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET RESEND_API_KEY; do
            V="${!S}"
            if [ -n "$V" ]; then printf '%s' "$V" | npx -y wrangler@3 secret put "$S"; else echo "::warning::$S not set"; fi
          done
