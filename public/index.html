<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales by Gershon.AI</title>
<meta name="theme-color" content="#CC3333">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23CC3333'/%3E%3Cpath d='M14 44l12-12 8 8 16-18' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/unified-theme.css?v=1.1.1">
</head>
<body>
<div class="auth-wrap" id="authWrap" style="display:none">
<div id="auth" class="card">
  <div class="wm"><svg viewBox="0 0 64 64" width="36" height="36" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#CC3333"/><path d="M14 44l12-12 8 8 16-18" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg><span><span class="wm-t">Sales</span><span class="wm-s">by Gershon.AI</span></span></div>
  <h2 id="authTitle">Sign in</h2>
  <p class="muted" id="authHint"></p>
  <label for="em">Email</label><input id="em" type="email" autocomplete="username" placeholder="you@company.com">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="Password">
  <button class="b p" id="authBtn">Continue</button><span id="authErr" class="muted"></span>
  <div class="auth-foot">Sales by Gershon.AI · <span class="appver"></span></div>
</div>
</div>
<div id="app" class="shell" style="display:none">
<aside class="side" id="side">
  <a class="wm" href="/"><svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#CC3333"/><path d="M14 44l12-12 8 8 16-18" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg><span><span class="wm-t">Sales</span><span class="wm-s">by Gershon.AI</span></span></a>
  <nav>
    <div class="nav-h">Copilot</div>
    <button data-t="chat" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Chat</button>
    <button data-t="due"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>Due<span class="cnt" id="dueBadge" hidden></span></button>
    <button data-t="drafts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Drafts</button>
    <button data-t="pipe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18l-7 8v6l-4 2v-8z"/></svg>Pipeline</button>
  </nav>
  <div class="side-f">
    <button class="b" id="syncBtn">Sync Streak</button>
    <a class="b" id="gmailBtn" href="/oauth/google/start">Connect Gmail</a>
    <button class="b" id="outBtn">Sign out</button>
    <div class="who"><span id="whoEmail"></span><span class="ver appver"></span></div>
  </div>
</aside>
<div class="scrim" id="scrim"></div>
<div class="body">
<header class="top">
  <button class="menu" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <h1 id="pageTitle">Chat</h1>
  <span class="sp"></span>
  <span class="muted" id="status"></span>
</header>
<main>
  <section id="t-chat">
    <div class="card"><div id="log"><div class="msg muted">Ask about the pipeline: “Who should I follow up this week?”, “Where are we with TEPCOMP?”, “Which proposals have been silent for 60+ days?”</div></div></div>
    <div class="row"><textarea id="q" rows="2" placeholder="Message…" style="flex:1"></textarea><button class="b p" id="send">Send</button></div>
  </section>
  <section id="t-due" style="display:none"><div class="card"><div class="row"><b id="dueCount"></b><span class="sp"></span><button class="b p" id="weeklyBtn">Draft all due</button></div></div><div class="card wrap"><table id="dueT"></table></div></section>
  <section id="t-drafts" style="display:none"><div id="draftList"></div></section>
  <section id="t-pipe" style="display:none"><div class="card wrap"><table id="pipeT"></table></div></section>
</main>
</div>
</div>
<script>
const APP_VERSION='v1.1.1';
const $=s=>document.querySelector(s);
document.querySelectorAll('.appver').forEach(e=>e.textContent=APP_VERSION);
const TITLES={chat:'Chat',due:'Due follow-ups',drafts:'Drafts',pipe:'Pipeline'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,b){const r=await fetch(p,b===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j}
let deals=[],hist=[];
async function boot(){
  const m=await api('/api/me');
  if(m.setup||!m.auth){
    $('#authWrap').style.display='flex';
    $('#authTitle').textContent=m.setup?'Welcome':'Sign in';
    $('#authHint').textContent=m.setup?'First visit: choose your password for this app.':'Use your Sales by Gershon.AI password.';
    $('#authBtn').onclick=async()=>{try{await api(m.setup?'/api/setup':'/api/login',{email:$('#em').value,password:$('#pw').value});location.href='/'}catch(e){$('#authErr').textContent=e.message}};
    return;
  }
  $('#app').style.display='flex';
  $('#whoEmail').textContent=m.email||'';
  $('#gmailBtn').textContent=m.gmail?'Gmail connected ✓':'Connect Gmail';$('#gmailBtn').title=m.gmail?(m.gmailAccount||''):'Connect Gmail';
  $('#status').textContent=m.lastSync?('Synced '+new Date(m.lastSync).toLocaleString()):'Not synced yet';
  await loadPipe();
}
async function loadPipe(){
  try{deals=await api('/api/pipeline')}catch(e){deals=[]}
  const due=deals.filter(d=>d.due);
  $('#dueCount').textContent=due.length+' deals due for a follow-up';
  $('#dueBadge').textContent=due.length;$('#dueBadge').hidden=!due.length;
  const head='<tr><th>Deal</th><th>Stage</th><th class="hide-sm">Owner</th><th>Silent</th><th></th></tr>';
  const row=d=>`<tr><td><b>${esc(d.name)}</b><div class="muted">${esc((d.notes||'').slice(0,140))}</div></td><td><span class="tag">${esc(d.stage_name)}</span></td><td class="hide-sm">${esc(d.owner||'—')}</td><td class="${d.due?'due':''}">${d.days_silent??'?'}d</td><td><div class="row"><button class="b" onclick="draft('${d.key}','email')">Email</button><button class="b" onclick="draft('${d.key}','linkedin')">LinkedIn</button></div></td></tr>`;
  $('#dueT').innerHTML=head+due.map(row).join('');
  $('#pipeT').innerHTML=head+deals.map(row).join('');
}
async function draft(key,ch){try{await api('/api/draft',{boxKey:key,channel:ch});show('drafts')}catch(e){alert(e.message)}}
async function loadDrafts(){
  const list=await api('/api/drafts');
  $('#draftList').innerHTML=list.length?list.map(d=>`<div class="card" id="d${d.id}"><div class="row"><b>${esc(d.name)}</b><span class="tag">${d.channel}</span>${d.status==='linkedin_queue'?'<span class="tag">queued for Charles</span>':''}</div>
  ${d.channel==='email'?`<br><input value="${esc(d.to_addr)}" placeholder="To" data-f="to_addr"><br><br><input value="${esc(d.subject)}" data-f="subject"><br>`:''}<br><textarea rows="7" data-f="body">${esc(d.body)}</textarea><br><br>
  <div class="row">${d.status==='linkedin_queue'?`<button class="b p" onclick="act(${d.id},'done')">Mark sent</button>`:`<button class="b p" onclick="act(${d.id},'approve')">${d.channel==='email'?'Approve &amp; send':'Approve → LinkedIn queue'}</button>`}<button class="b" onclick="act(${d.id},'reject')">Discard</button></div></div>`).join(''):'<div class="card muted">No drafts waiting.</div>';
}
async function act(id,a){const c=$('#d'+id),data={};c.querySelectorAll('[data-f]').forEach(e=>data[e.dataset.f]=e.value);try{await api(`/api/drafts/${id}/${a}`,data);loadDrafts();loadPipe()}catch(e){alert(e.message)}}
function show(t){$('#pageTitle').textContent=TITLES[t];$('#app').classList.remove('open');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));['chat','due','drafts','pipe'].forEach(x=>$('#t-'+x).style.display=x===t?'block':'none');if(t==='drafts')loadDrafts()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.t));
$('#syncBtn').onclick=async()=>{$('#syncBtn').textContent='Syncing…';try{const r=await api('/api/sync',{});$('#status').textContent=r.synced+' deals synced';await loadPipe()}catch(e){alert(e.message)}$('#syncBtn').textContent='Sync Streak'};
$('#weeklyBtn').onclick=async()=>{$('#weeklyBtn').textContent='Drafting…';try{const r=await api('/api/weekly',{});alert(r.drafts+' drafts created');show('drafts')}catch(e){alert(e.message)}$('#weeklyBtn').textContent='Draft all due'};
function addMsg(role,text){const el=document.createElement('div');el.className='msg '+(role==='user'?'u':'');let h=esc(text);h=h.replace(/^DRAFT:\s*(.+?)\s*\|\s*(email|linkedin)\s*$/gmi,(m,n,ch)=>{const d=deals.find(x=>x.name.trim().toLowerCase()===n.trim().toLowerCase());return d?`<button class="b" onclick="draft('${d.key}','${ch.toLowerCase()}')">✍️ Draft ${ch} for ${esc(d.name)}</button>`:m});el.innerHTML=h;$('#log').appendChild(el);$('#log').scrollTop=1e9}
$('#send').onclick=async()=>{const q=$('#q').value.trim();if(!q)return;$('#q').value='';addMsg('user',q);try{const r=await api('/api/chat',{message:q,history:hist});hist.push({role:'user',content:q},{role:'assistant',content:r.reply});addMsg('assistant',r.reply)}catch(e){addMsg('assistant','Error: '+e.message)}};
$('#q').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#send').click()}};
$('#menuBtn').onclick=()=>$('#app').classList.add('open');
$('#scrim').onclick=()=>$('#app').classList.remove('open');
$('#outBtn').onclick=async()=>{try{await api('/api/logout',{})}catch(e){}location.href='/'};
boot();
</script>
</body>
</html>
